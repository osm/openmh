name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Development checks
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Enable GitHub build cache
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Check default and software-only builds
        run: >-
          docker buildx build --platform linux/amd64 --file docker/Dockerfile
          --target linux-check
          --cache-from type=gha,scope=linux_amd64,version=2
          --cache-from type=gha,scope=linux_checks,version=2
          --cache-to type=gha,scope=linux_checks,version=2,mode=max,ignore-error=true .

  build:
    needs: check
    name: ${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux_amd64
            platform: linux
            archive: openmh-*-linux-*.tar.gz
          - target: windows_amd64
            platform: windows
            archive: openmh-*-windows-*.zip
          - target: wasm32
            platform: wasm
            archive: openmh-*-wasm.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The build scripts invoke Buildx directly, so expose its cache credentials.
      - name: Enable GitHub build cache
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Build release bundles
        env:
          BUILDKIT_PROGRESS: plain
        run: >-
          ./scripts/build_docker_${{ matrix.target }}
          --cache-from type=gha,scope=linux_checks,version=2
          --cache-from type=gha,scope=${{ matrix.target }},version=2
          --cache-to type=gha,scope=${{ matrix.target }},version=2,mode=max,ignore-error=true

      - name: Verify release checksums
        working-directory: build/packages/${{ matrix.platform }}
        run: sha256sum --check --strict *.sha256

      - name: Install Wine for the Windows launch check
        if: matrix.platform == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64

      - name: Launch the same Linux archive on Ubuntu 24.04 and 26.04
        if: matrix.platform == 'linux'
        run: |
          for version in 24.04 26.04; do
            ./scripts/check integration standalone_release --linux-image "ubuntu:$version" \
              build/packages/linux/${{ matrix.archive }}
          done

      - name: Launch each Windows application on its own
        if: matrix.platform == 'windows'
        env:
          WINEDEBUG: -all
          WINEPREFIX: ${{ runner.temp }}/openmh-wine
        run: >-
          ./scripts/check integration standalone_release
          build/packages/${{ matrix.platform }}/${{ matrix.archive }}

      - name: Check browser saves in the packaged Wasm runtime
        if: matrix.platform == 'wasm'
        run: >-
          ./scripts/check integration browser_storage --browser chrome
          --runtime build/packages/wasm/browser-runtime
          --output build/checks/release_browser_storage

      - name: Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/packages/${{ matrix.platform }}/${{ matrix.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload release checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/packages/${{ matrix.platform }}/${{ matrix.archive }}.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14
